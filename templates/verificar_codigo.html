{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-800/80 shadow-2xl text-center">
        <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl text-indigo-400 inline-block mb-4">
            <i class="fa-solid fa-envelope-circle-check text-2xl"></i>
        </div>
        
        <h2 class="text-xl font-bold text-white mb-2">Verifique seu E-mail</h2>
        <p class="text-xs text-slate-400 mb-6">Enviamos um código de verificação de 6 dígitos para o seu e-mail.</p>

        <form method="POST" class="space-y-4">
            {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>{% endif %}
            
            <div>
                <input type="text" name="codigo" maxlength="6" required placeholder="000000" 
                       class="w-full text-center tracking-[0.5em] font-mono text-xl bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-emerald-400 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 text-sm">
                Confirmar e Criar Conta
            </button>
        </form>
    </div>
</div>
{% endblock %}
