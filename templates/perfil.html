{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto space-y-6">

    <!-- FOTO E INFOS -->
    <div class="bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-800/80 shadow-2xl text-center">
        <div class="mb-4 inline-block relative">
            {% if current_user.foto_perfil != 'default.png' %}
                <img src="{{ url_for('static', filename='uploads/' + current_user.foto_perfil) }}" class="w-24 h-24 rounded-full object-cover border-2 border-indigo-500/50 mx-auto">
            {% else %}
                <div class="w-24 h-24 rounded-full bg-indigo-500/10 border-2 border-indigo-500/30 text-indigo-400 flex items-center justify-center text-3xl font-bold mx-auto">
                    {{ current_user.username[0].upper() }}
                </div>
            {% endif %}
        </div>
        <h3 class="text-lg font-bold text-white">{{ current_user.username }}</h3>
    </div>

    <!-- ALTERAR FOTO -->
    <div class="bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-800/80 shadow-2xl">
        <h4 class="text-sm font-bold text-white mb-4">Atualizar Foto de Perfil</h4>
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" name="alterar_foto" value="1">
            <input type="file" name="foto" accept="image/*" required class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 rounded-xl transition-all">Upload Foto</button>
        </form>
    </div>

    <!-- ALTERAR SENHA DA CONTA -->
    <div class="bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-800/80 shadow-2xl">
        <h4 class="text-sm font-bold text-white mb-4">Alterar Senha de Acesso</h4>
        <form method="POST" class="space-y-3">
            <input type="hidden" name="alterar_senha" value="1">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Senha Atual</label>
                <input type="password" name="senha_atual" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Nova Senha</label>
                <input type="password" name="nova_senha" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold py-2.5 rounded-xl transition-all">Atualizar Senha</button>
        </form>
    </div>

</div>
{% endblock %}
