{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-800/80 shadow-2xl">
        <h2 class="text-xl font-bold text-white text-center mb-6">Criar Nova Conta</h2>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Usuário</label>
                <input type="text" name="username" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Senha</label>
                <input type="password" name="senha" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-emerald-600/20">Cadastrar</button>
        </form>
        <p class="text-xs text-center text-slate-400 mt-6">Já possui uma conta? <a href="{{ url_for('login') }}" class="text-indigo-400 hover:underline">Faça login</a></p>
    </div>
</div>
{% endblock %}
