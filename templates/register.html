{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-800/80 shadow-2xl">
        <h2 class="text-xl font-bold text-white text-center mb-6">Criar Nova Conta</h2>
        
        <form method="POST" class="space-y-4">
            {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>{% endif %}
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Nome Completo</label>
                <input type="text" name="nome" required placeholder="Ex: João Silva" 
                       class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Data de Nascimento</label>
                <input type="date" name="data_nascimento" required 
                       class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">E-mail</label>
                <input type="email" name="email" required placeholder="seu@email.com" 
                       class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Nome de Usuário</label>
                <input type="text" name="username" required placeholder="usuario123" 
                       class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Senha</label>
                <input type="password" name="senha" required placeholder="••••••••" 
                       class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-emerald-600/20 text-sm">
                Enviar Código de Verificação
            </button>
        </form>

        <p class="text-xs text-center text-slate-400 mt-6">
            Já possui uma conta? <a href="{{ url_for('login') }}" class="text-indigo-400 hover:underline">Faça login</a>
        </p>
    </div>
</div>
{% endblock %}
