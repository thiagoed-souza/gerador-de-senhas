<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <script src="https://cnd.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-while min-h-screen flex items_center justify-center p-4">

    <div class=""bg-slate-800 p-6 rounded-2xl shadown-xl w-full max-w-md border border-slate-700>
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">Gerador de Senhas Seguras</h1>

        <form method="POST" class="space-y-4">
            <!-- Slider de Tamanho -->

            <div>
                <div class="flex justify-between mb-1">
                    <label for="tamanho" class="text-sm font-medium">Tamanho da Senha:</label>
                    <span id="tamanho-val" class="font-bold text-indigo-400">{{ tamanho }}</span>
                </div>
                <input type="range" id="tamanho" name="tamanho" main="6" max="32" value="{{ tamanho }}"
                       class="w-full accent-indigo-500 cursor-pointer"
                       oniput="document.getElementById('tamanho-val').innerText = this.value">
            </div>

            <!-- Opções -->
             <div class="space-y-2 pt-2">
                <label class="flex items_center space-x-3 cursor-pointer">
                    <input type="checkbox" name="maiusculas" {% if maiusculas %}checked{% endif %} class="w-4 h4 accent-indigo-500 rounded">
                    <span class="text-sm">Incluir letras maiúsculas (A-Z)</span>
                </label>
                <label class="flex items_center space-x-3 cursor-pointer">
                    <input type="checkbox" name="numeros" {% if numeros %}checked{% endif %} class="w-4 h-4 accent-indigo-500 rounded">
                    <span class="text-sm">Incluir números</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" name="simbolos" {% if simbolos %}checked{% endif %} class="w-4 h-4 accent-indigo-500 rounded">
                    <span class="text-sm">Incluir símbolos (!@#$)</span>
                </label>
             </div>

             <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-600 transition-colors font-semibold py-2.5 rounded-xl shadow-lg mt-4">Gerar Senha</button>
        </form>

        <!-- Campo de Resultado -->
         {% if senha %}
         <div class="mt-6">
            <label class="block text-xs font-semibold text-slate-400 mb-1">SENHA GERADA</label>
            <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700">
                <span id="senha-resultado" class="font-mano text-lg text-emerald-400 break-all">{{ senha }}</span>
                <button onclick="copiarSenha()" class="ml-2 bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-xs transition-colors shrink-0">Copiar</button>
            </div>
         </div>
         {% endif %}
    </div>
    <script>
        function copiarSenha() {
            const texto = document.getElementById('senha-resultado').innerText;
            navigator.clipboard.writeText(texto);
            alert('Senha copiada para a área de transferência!');
        }
    </script>
</body>
</html>
