<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Seguras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <!-- Efeito de Brilho de Fundo -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800/80">
        
        <!-- Cabeçalho -->
        <div class="flex items-center space-x-3 mb-6">
            <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl text-indigo-400">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Gerador de Senhas</h1>
                <p class="text-xs text-slate-400">Crie combinações fortes e seguras</p>
            </div>
        </div>

        <form method="POST" class="space-y-6">
            <!-- Controle de Tamanho -->
            <div class="bg-slate-950/50 p-4 rounded-2xl border border-slate-800/60">
                <div class="flex justify-between items-center mb-3">
                    <label for="tamanho" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tamanho da Senha</label>
                    <span id="tamanho-val" class="text-sm font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-0.5 rounded-lg">{{ tamanho }}</span>
                </div>
                <input type="range" id="tamanho" name="tamanho" min="6" max="32" value="{{ tamanho }}" 
                       class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                       oninput="atualizarTamanho(this.value)">
            </div>

            <!-- Seleção de Opções -->
            <div class="space-y-2.5">
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950/40 hover:bg-slate-800/40 border border-slate-800/60 transition-all cursor-pointer group">
                    <span class="text-sm font-medium text-slate-300 group-hover:text-white">Letras Maiúsculas (A-Z)</span>
                    <input type="checkbox" name="maiusculas" id="opt-maiusculas" {% if maiusculas %}checked{% endif %} 
                           onchange="atualizarForca()" class="w-4 h-4 accent-indigo-500 rounded cursor-pointer">
                </label>
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950/40 hover:bg-slate-800/40 border border-slate-800/60 transition-all cursor-pointer group">
                    <span class="text-sm font-medium text-slate-300 group-hover:text-white">Números (0-9)</span>
                    <input type="checkbox" name="numeros" id="opt-numeros" {% if numeros %}checked{% endif %} 
                           onchange="atualizarForca()" class="w-4 h-4 accent-indigo-500 rounded cursor-pointer">
                </label>
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950/40 hover:bg-slate-800/40 border border-slate-800/60 transition-all cursor-pointer group">
                    <span class="text-sm font-medium text-slate-300 group-hover:text-white">Símbolos Especial (!@#$)</span>
                    <input type="checkbox" name="simbolos" id="opt-simbolos" {% if simbolos %}checked{% endif %} 
                           onchange="atualizarForca()" class="w-4 h-4 accent-indigo-500 rounded cursor-pointer">
                </label>
            </div>

            <!-- Indicador de Força -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs">
                    <span class="text-slate-400">Força estimada:</span>
                    <span id="forca-texto" class="font-bold text-slate-400">-</span>
                </div>
                <div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
                    <div id="forca-barra" class="h-full w-0 transition-all duration-300 rounded-full"></div>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] transition-all font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                <span>Gerar Nova Senha</span>
            </button>
        </form>

        <!-- Campo de Resultado -->
        {% if senha %}
        <div class="mt-6 pt-6 border-t border-slate-800/80">
            <div class="flex justify-between items-center mb-1.5">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resultado</span>
            </div>
            <div class="flex items-center justify-between bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 group">
                <span id="senha-resultado" class="font-mono text-base text-emerald-400 break-all select-all">{{ senha }}</span>
                <button id="btn-copiar" onclick="copiarSenha()" title="Copiar senha"
                        class="ml-3 p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition-all shrink-0 active:scale-95 border border-slate-700/50">
                    <i id="icone-copiar" class="fa-regular fa-copy text-sm"></i>
                </button>
            </div>
        </div>
        {% endif %}
    </div>

    <script>
        function atualizarTamanho(val) {
            document.getElementById('tamanho-val').innerText = val;
            atualizarForca();
        }

        function atualizarForca() {
            const tamanho = parseInt(document.getElementById('tamanho').value);
            const maiusculas = document.getElementById('opt-maiusculas').checked;
            const numeros = document.getElementById('opt-numeros').checked;
            const simbolos = document.getElementById('opt-simbolos').checked;

            let pontos = 0;

            if (tamanho >= 8) pontos += 1;
            if (tamanho >= 12) pontos += 1;
            if (tamanho >= 16) pontos += 1;
            if (maiusculas) pontos += 1;
            if (numeros) pontos += 1;
            if (simbolos) pontos += 2;

            const barra = document.getElementById('forca-barra');
            const texto = document.getElementById('forca-texto');

            if (pontos <= 2) {
                barra.className = 'h-full bg-rose-500 rounded-full transition-all duration-300 w-1/4';
                texto.innerText = 'Muito Fraca';
                texto.className = 'font-bold text-rose-400';
            } else if (pontos <= 4) {
                barra.className = 'h-full bg-amber-500 rounded-full transition-all duration-300 w-2/4';
                texto.innerText = 'Média';
                texto.className = 'font-bold text-amber-400';
            } else if (pontos <= 6) {
                barra.className = 'h-full bg-emerald-500 rounded-full transition-all duration-300 w-3/4';
                texto.innerText = 'Forte';
                texto.className = 'font-bold text-emerald-400';
            } else {
                barra.className = 'h-full bg-indigo-400 rounded-full transition-all duration-300 w-full';
                texto.innerText = 'Impenetrável';
                texto.className = 'font-bold text-indigo-300';
            }
        }

        function copiarSenha() {
            const texto = document.getElementById('senha-resultado').innerText;
            navigator.clipboard.writeText(texto);
            
            const icone = document.getElementById('icone-copiar');
            const btn = document.getElementById('btn-copiar');
            
            icone.className = 'fa-solid fa-check text-emerald-400';
            btn.classList.add('border-emerald-500/50');
            
            setTimeout(() => {
                icone.className = 'fa-regular fa-copy text-sm';
                btn.classList.remove('border-emerald-500/50');
            }, 2000);
        }

        // Executa ao carregar para atualizar a barra de força com as opções padrão
        document.addEventListener('DOMContentLoaded', atualizarForca);
    </script>

</body>
</html>
