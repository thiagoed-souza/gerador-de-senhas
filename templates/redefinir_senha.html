{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Redefinir Senha</h2>
    <p>Enviamos um código para {{ email }}</p>
    <form method="POST">
        <label>Código de Verificação:</label>
        <input type="text" name="codigo" required maxlength="6" placeholder="123456">
        
        <label>Nova Senha:</label>
        <input type="password" name="nova_senha" required placeholder="Sua nova senha">
        
        <button type="submit" class="btn">Atualizar Senha</button>
    </form>
</div>
{% endblock %}
